plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name.replaceAll('\\s', '')}-neoforge-26.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

neoForge {
    version = neoforge_261_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 把 common 的 class 输出并入本 target 的 main sourceSet 输出。
// 这是必需的：moddev 只会把 sourceSet 的输出放进 mod 的运行时 classpath，
// 而 `implementation project(':common')` 只保证编译期可见——少了这一句，
// 运行时一碰 common 的类就会 NoClassDefFoundError。
// 同时也让 final jar 自动包含 common 的 class，无需再手工 from(...)。
sourceSets.main.output.dir(
        project(':common').layout.buildDirectory.dir('classes/java/main'),
        builtBy: ':common:classes'
)

repositories {
    mavenCentral()
    maven { url = 'https://maven.sighs.cc/repository/maven-public/' }
}

dependencies {
    implementation "com.sighs:ApricityUI-neoforge-26.1:1.2.4"
    implementation project(':common')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: neoforge_261_minecraft_version,
            neoforge_version: neoforge_261_version,
            neoforge_version_range: neoforge_261_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: file('../../gradle/target-conventions/publish.gradle')
