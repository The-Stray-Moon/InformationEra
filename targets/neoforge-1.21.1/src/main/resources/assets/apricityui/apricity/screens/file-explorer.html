<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-viewport" content="mode=browser">
    <link rel="stylesheet" href="/apricityui/theme/ore/ore.css">
    <link rel="stylesheet" href="/styles/file-explorer.css">
</head>
<body class="ore-theme fe-body">

    <div class="fe-capture" id="fe-capture"></div>

    <div class="fe" id="fe-window">

        <div class="fe-titlebar" id="fe-titlebar">
            <div class="fe-tabstrip" id="fe-tabstrip"></div>
            <div class="fe-window-controls">
                <button class="fe-window-btn" id="fe-min" type="button" aria-label="最小化">
                    <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="fe-window-btn" id="fe-max" type="button" aria-label="最大化">
                    <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="fe-window-btn fe-window-close" id="fe-close" type="button" aria-label="关闭">
                    <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/></svg>
                </button>
            </div>
        </div>

        <div class="fe-addressbar">
            <button class="icon-button fe-tool-btn" id="fe-back" type="button" aria-label="后退">
                <svg viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="icon-button fe-tool-btn" id="fe-forward" type="button" aria-label="前进">
                <svg viewBox="0 0 24 24"><polyline points="9,4 17,12 9,20" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="icon-button fe-tool-btn" id="fe-up" type="button" aria-label="上移">
                <svg viewBox="0 0 24 24"><polyline points="4,15 12,7 20,15" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>

            <div class="fe-breadcrumb" id="fe-breadcrumb"></div>
            <div class="fe-searchbar">
                <input class="form-input-2" id="fe-search" type="text" placeholder="搜索">
                <svg class="fe-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
        </div>

        <div class="fe-commandbar">
            <button class="fe-cmd-btn" id="fe-new" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v11H3z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>新建 ▾
            </button>
            <span class="fe-cmd-sep"></span>
            <button class="fe-cmd-btn" id="fe-cmd-cut" type="button" aria-label="剪切">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="8.4" y1="8.4" x2="20" y2="20"/><line x1="8.4" y1="15.6" x2="20" y2="4"/></svg>
            </button>
            <button class="fe-cmd-btn" id="fe-cmd-copy" type="button" aria-label="复制">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11"/><path d="M5 15H4V4h11v1"/></svg>
            </button>
            <button class="fe-cmd-btn" id="fe-cmd-paste" type="button" aria-label="粘贴">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="12" height="16"/><path d="M9 2h6v4H9z"/></svg>
            </button>
            <button class="fe-cmd-btn" id="fe-cmd-rename" type="button" aria-label="重命名">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3l4 4-9 9-5 1 1-5z"/></svg>
            </button>
            <button class="fe-cmd-btn" id="fe-cmd-delete" type="button" aria-label="删除">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
            </button>
            <span class="fe-cmd-sep"></span>
            <button class="fe-cmd-btn" id="fe-sort" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16"/><path d="M3 8l4-4 4 4"/><path d="M17 20V4"/><path d="M13 16l4 4 4-4"/></svg>排序 ▾
            </button>
            <button class="fe-cmd-btn" id="fe-layout" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>查看 ▾
            </button>
            <span class="fe-cmd-spacer"></span>
            <button class="fe-cmd-btn" id="fe-preview" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16"/><line x1="14" y1="4" x2="14" y2="20"/></svg>预览
            </button>
        </div>

        <div class="fe-body-area">
            <nav class="fe-nav" id="fe-nav" aria-label="导航窗格"></nav>
            <main class="fe-main">
                <div class="fe-content" id="fe-content"></div>
                <div class="fe-details-pane" id="fe-details-pane"></div>
            </main>
            <aside class="fe-preview-pane" id="fe-preview-pane"></aside>
        </div>

        <div class="fe-statusbar">
            <span id="fe-item-count"></span>
            <span class="fe-status-sep"></span>
            <span id="fe-selection-count"></span>
            <span id="fe-message"></span>
            <span class="fe-status-spacer"></span>
            <div class="fe-status-views">
                <button class="fe-status-view" id="fe-view-details" type="button" aria-label="详细信息">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <button class="fe-status-view" id="fe-view-thumb" type="button" aria-label="大缩略图">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                </button>
            </div>
        </div>

        <div class="fe-resize fe-resize-n" data-resize="n"></div>
        <div class="fe-resize fe-resize-s" data-resize="s"></div>
        <div class="fe-resize fe-resize-e" data-resize="e"></div>
        <div class="fe-resize fe-resize-w" data-resize="w"></div>
        <div class="fe-resize fe-resize-ne" data-resize="ne"></div>
        <div class="fe-resize fe-resize-nw" data-resize="nw"></div>
        <div class="fe-resize fe-resize-se" data-resize="se">
            <svg viewBox="0 0 12 12"><line x1="3" y1="12" x2="12" y2="3" stroke="#77797c" stroke-width="1"/><line x1="7" y1="12" x2="12" y2="7" stroke="#77797c" stroke-width="1"/><line x1="11" y1="12" x2="12" y2="11" stroke="#77797c" stroke-width="1"/></svg>
        </div>
        <div class="fe-resize fe-resize-sw" data-resize="sw"></div>

    </div>

    <div class="fe-selection-rect" id="fe-selection-rect"></div>

    <div class="fe-ctx-menu" id="fe-context-menu"></div>

    <input class="fe-rename-input" id="fe-rename-input" type="text">

    <div class="fe-tooltip" id="fe-tooltip"></div>

    <div class="fe-drag-ghost" id="fe-drag-ghost"></div>

</body>
</html>
